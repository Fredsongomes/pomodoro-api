services:
  postgres:
    image: postgres:16
    container_name: pomodoro-postgres
    environment:
      POSTGRES_DB: pomodoro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina a variavel de ambiente DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pomodoro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: pomodoro-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pomodoro
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
